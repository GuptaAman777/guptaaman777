<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reader — GuptaAman777</title>
  <link rel="icon" href="assets/logo.png" type="image/png" sizes="64x64" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/reader.css" />
</head>
<body>
  <div class="ambient-canvas" aria-hidden="true">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
  </div>
  <div class="ambient-grid" aria-hidden="true"></div>

  <header class="site-header">
    <div class="nav-capsule">
      <a href="index.html" class="brand-link">
        <img src="assets/logo.png" alt="Logo" />
        <span>GuptaAman777</span>
      </a>

      <ul class="nav-links" id="navMenu">
        <li><a href="index.html#comics">Scanlations</a></li>
        <li><a id="chapterListLink" href="index.html#comics">Chapter List</a></li>
        <li><a href="index.html#projects">Projects</a></li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>

      <div class="nav-actions">
        <button id="themeToggle" class="icon-pill-btn" title="Toggle Dark / Frost Glass" aria-label="Toggle theme">
          <i class="fas fa-sun"></i>
        </button>
        <button id="menuToggle" class="icon-pill-btn menu-toggle" aria-label="Toggle navigation menu">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <section class="glass-surface reader-toolbar">
        <div>
          <span class="section-eyebrow" style="margin-bottom: 4px;">Web Reader</span>
          <h1 id="chapter-title">Loading Chapter...</h1>
        </div>
        <div class="reader-controls">
          <select id="chapterSelect" class="glass-select" aria-label="Select chapter"></select>
        </div>
      </section>

      <section>
        <div id="page-container" class="reader-canvas">
          <div class="glass-surface loading-state">Loading chapter pages...</div>
        </div>

        <div class="glass-surface reader-bottom-bar">
          <button id="prevChapter" class="glass-btn glass-btn-sm">
            <i class="fas fa-chevron-left"></i> Previous Chapter
          </button>
          <span id="chapterInfo" class="glass-pill">Chapter 0 of 0</span>
          <button id="nextChapter" class="glass-btn glass-btn-sm glass-btn-primary">
            Next Chapter <i class="fas fa-chevron-right"></i>
          </button>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="glass-surface footer-glass">
        <div class="brand-link">
          <img src="assets/logo.png" alt="Logo" />
          <span>GuptaAman777</span>
        </div>
        <p class="footer-note">
          &copy; <span id="currentYear"></span> GuptaAman777. Tip: Use Left / Right arrow keys to switch chapters.
        </p>
      </div>
    </div>
  </footer>

  <script src="js/glass.js"></script>
  <script src="js/reader.js"></script>
</body>
</html>
