<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comic Details — GuptaAman777</title>
  <link rel="icon" href="assets/logo.png" type="image/png" sizes="64x64" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/details.css" />
</head>
<body>
  <div class="ambient-canvas" aria-hidden="true">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
  </div>
  <div class="ambient-grid" aria-hidden="true"></div>

  <header class="site-header">
    <div class="nav-capsule">
      <a href="index.html" class="brand-link">
        <img src="assets/logo.png" alt="Logo" />
        <span>GuptaAman777</span>
      </a>

      <ul class="nav-links" id="navMenu">
        <li><a href="index.html#imagetool">ImageTool</a></li>
        <li><a href="index.html#projects">Projects</a></li>
        <li><a href="index.html#comics">Scanlations</a></li>
        <li><a href="index.html#about">Team</a></li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>

      <div class="nav-actions">
        <button id="themeToggle" class="icon-pill-btn" title="Toggle Dark / Frost Glass" aria-label="Toggle theme">
          <i class="fas fa-sun"></i>
        </button>
        <a href="index.html#comics" class="glass-btn glass-btn-sm">
          <i class="fas fa-arrow-left"></i> Back
        </a>
        <button id="menuToggle" class="icon-pill-btn menu-toggle" aria-label="Toggle navigation menu">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <section class="glass-surface details-hero">
        <img id="cover-image" class="details-cover" src="assets/logo.png" alt="Comic Cover" />
        <div class="details-meta">
          <span class="glass-pill" id="comic-status">Loading...</span>
          <h1 id="comic-title" style="margin-top: 12px;">Loading...</h1>
          <div id="comic-genres" class="genre-pills"></div>
          <div id="comic-info" class="details-facts"></div>
          <p id="comic-description" class="details-desc"></p>
        </div>
      </section>

      <section class="glass-surface chapters-panel">
        <h2 style="font-size: 1.4rem; font-weight: 800;">Chapters</h2>
        <div class="details-chapter-list" id="chapterList">
          <div class="loading-state">Loading chapters...</div>
        </div>
        <div class="pagination-bar">
          <button id="prevPage" class="glass-btn glass-btn-sm" disabled>
            <i class="fas fa-chevron-left"></i> Previous
          </button>
          <span id="pageInfo" class="glass-pill">Page 1 of 1</span>
          <button id="nextPage" class="glass-btn glass-btn-sm" disabled>
            Next <i class="fas fa-chevron-right"></i>
          </button>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="glass-surface footer-glass">
        <div class="brand-link">
          <img src="assets/logo.png" alt="Logo" />
          <span>GuptaAman777</span>
        </div>
        <p class="footer-note">
          &copy; <span id="currentYear"></span> GuptaAman777. Fan translations belong to their respective authors.
        </p>
      </div>
    </div>
  </footer>

  <script src="js/glass.js"></script>
  <script src="js/details.js"></script>
</body>
</html>
